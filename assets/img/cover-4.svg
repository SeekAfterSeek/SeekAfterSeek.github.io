      <line x1="600" y1="0" x2="600" y2="900"/>
      <line x1="900" y1="0" x2="900" y2="900"/>
    </g>
    <text x="64" y="812" font-family="Georgia, 'Times New Roman', serif" font-size="168" fill="#1b222b" fill-opacity="0.5">04</text>
    <text x="1140" y="120" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="22" letter-spacing="6" fill="#1b222b" fill-opacity="0.42">WORK / 04</text>
    <rect width="1200" height="900" filter="url(#n3)" opacity="0.055"/>
